<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="main">
      <div class="addQuestion" id="Add-Questions">
        <button class="Addquestion">Add question</button>
      </div>

      <!-- welcome section  -->
      <div class="container display" id="Start-quizz">
        <span class="header"> Welcome to Quizz section </span>
        <button class="nextBtn" id="start-quizz">Start Quizz</button>
      </div>
      <!-- question section -->
      <div class="questionSection hide" id="Question-Section">
        <span class="header" id="Question-title"> </span>
        <button class="buttonBack" id="Back-Buttton">Back</button>

        <ul class="optionList" id="option-list"></ul>

        <div class="btns">
          <button class="nextBtn" id="next-btn">Next</button>
        </div>
      </div>

      <!-- result section  -->
      <div class="container hide" id="Result-Section">
        <span class="header"> Result of Your quizz </span>
      </div>

      <!-- add question Section -->

      <div class="QuestionAddContainer hide" id="Question-Container">
        <span>Add Questions</span>

        <button class="closeBtn" id="close-btn">Close</button>

        <form action="" class="question-form">
          <div class="inputBox" id="input-box">
            <label for="Question">Question</label>
            <input
              type="text"
              name="question"
              id="question"
              placeholder="Please Enter the Question"
            />
          </div>
          <div class="inputBox" id="input-box">
            Select the Number of options for the Question
            <select name="options" id="OptionsList">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>
          </div>

          <div class="optionsInputs" id="options-inputs">
            <div class="option-box">
              <label>Options 1</label>
              <input type="text" placeholder="Enter Option 1 " />
              <div class="flex">
                <div class="text">Correct Answer</div>
                <input type="radio" name="correctOption" />
              </div>
            </div>
          </div>

          <div class="errorMessage" id="error-message"></div>

          <button class="SubmitButton" id="submit-button">Submit</button>
        </form>
      </div>
    </div>
  </body>
</html>
