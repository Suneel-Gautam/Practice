<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="main">
      <div class="addQuestion hide">
        <button class="Addquestion">Add question</button>
      </div>

      <!-- welcome section  -->
      <div class="container display hide" id="Start-quizz">
        <span class="header"> Welcome to Quizz section </span>
        <button class="nextBtn">Start Quizz</button>
      </div>
      <!-- question section -->
      <div class="questionSection" id="Question-Section">
        <span class="header" id="Question-title"> </span>

        <ul class="optionList" id="option-list">
          
        </ul>

        <div class="btns">
          <button class="nextBtn" id="next-btn">Next</button>
        </div>
      </div>

      <!-- result section  -->
      <div class="container hide" id="Result-Section">
        <span class="header"> Result of Your quizz </span>
      </div>

      <!-- add question Section -->

      <div class="QuestionAddContainer hide">
        <span>Add Questions</span>

        <form action="" class="question-form">
          <div class="inputBox" id="input-box">
            <label for="Question">Question</label>
            <input type="text" name="question" id="question" />
          </div>
          <div>
            <label for="option">Options</label>
            <input type="text" name="option" id="option1" />
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
