<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme Switcher</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main-container light" id="main-container">
      <button id="change-theme">switch</button>
      <form action="" class="form-boxes">
        <div class="input-box">
          <label for="username"> Username </label>
          <input type="text" class="username" id="username" autofocus />
        </div>
        <div class="input-box">
          <label for="email"> Email </label>
          <input type="text" class="email" id="email" />
        </div>
        <div class="input-box">
          <label for="phonenumber"> Phone Number </label>
          <input type="text" class="phonenumber" id="phonenumber" />
        </div>
        <div class="input-box">
          <label for="password"> Password </label>
          <input type="text" class="password" id="password" />
        </div>
        <div class="input-box">
          <label for="confirmpassword"> Confirm Password </label>
          <input type="text" class="confirmpassword" id="confirmpassword" />
        </div>
        <button id="submit-btn">submit</button>
      </form>
    </div>
  </body>
</html>
